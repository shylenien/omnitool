<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Omni Tool - Đang chuyển hướng...</title>
    <script type="text/javascript">
      // GitHub Pages SPA Redirect Handler
      // Automatically normalizes direct URL paths into HashRouter routes
      var l = window.location;
      var pathParts = l.pathname.split('/').filter(Boolean);
      var isOmniRepo = pathParts.length > 0 && pathParts[0] === 'omnitool';
      var basePath = isOmniRepo ? '/omnitool/' : '/';
      var subPath = pathParts.slice(isOmniRepo ? 1 : 0).join('/');

      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + basePath;
      if (subPath) {
        redirectUrl += '#/' + subPath;
      }
      if (l.search) {
        redirectUrl += (subPath ? '' : '#/') + l.search;
      }
      if (l.hash && !subPath) {
        redirectUrl += l.hash;
      }

      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
  </body>
</html>
